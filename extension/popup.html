<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCNA Answer Lookup</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            width: 400px;
            max-height: 500px;
            overflow-y: auto;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
        }

        .header {
            background: linear-gradient(90deg, #0f3460 0%, #16213e 100%);
            padding: 12px 16px;
            border-bottom: 1px solid #0f3460;
        }

        .header h1 {
            font-size: 16px;
            font-weight: 600;
            color: #00d9ff;
        }

        .header .subtitle {
            font-size: 11px;
            color: #888;
            margin-top: 4px;
        }

        .content {
            padding: 16px;
        }

        .no-result {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }

        .no-result svg {
            width: 48px;
            height: 48px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .match-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .match-card:first-child {
            border-color: #00d9ff;
            background: rgba(0, 217, 255, 0.1);
        }

        .match-score {
            display: inline-block;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            background: #4CAF50;
            color: white;
            margin-bottom: 8px;
        }

        .match-score.low {
            background: #FF9800;
        }

        .question-text {
            font-size: 13px;
            line-height: 1.4;
            color: #ccc;
            margin-bottom: 12px;
            max-height: 80px;
            overflow-y: auto;
        }

        .answer-section {
            background: rgba(76, 175, 80, 0.1);
            border-left: 3px solid #4CAF50;
            padding: 8px 12px;
            border-radius: 0 4px 4px 0;
        }

        .answer-label {
            font-size: 10px;
            text-transform: uppercase;
            color: #4CAF50;
            margin-bottom: 4px;
            font-weight: 600;
        }

        .answer-text {
            font-size: 14px;
            font-weight: 500;
            color: #fff;
        }

        .images-section {
            margin-top: 12px;
        }

        .images-section img {
            max-width: 100%;
            border-radius: 4px;
            margin-top: 8px;
        }

        .explanation {
            margin-top: 12px;
            padding: 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
            font-size: 11px;
            color: #999;
            line-height: 1.4;
        }

        .search-text {
            font-size: 11px;
            color: #666;
            padding: 8px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            max-height: 60px;
            overflow-y: auto;
        }

        .all-choices {
            margin-top: 8px;
            font-size: 12px;
        }

        .choice {
            padding: 4px 0;
            color: #888;
        }

        .choice.correct {
            color: #4CAF50;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>🎯 CCNA Answer Lookup</h1>
        <div class="subtitle">Select question text on any page</div>
    </div>

    <div class="content" id="content">
        <div class="no-result" id="no-result">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <p>Select question text on a CCNA exam page</p>
        </div>

        <div id="results"></div>
    </div>

    <div class="search-text" id="search-text"></div>

    <script src="popup.js"></script>
</body>

</html>
